services:
  - type: web
    name: sih26089-coop-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        value: cooperative-sih89-demo-secret-key-2026
      - key: CORS_ORIGIN
        value: https://sih26089-coop.vercel.app
      - key: GEMINI_MODEL
        value: gemini-3.7-flash
      - key: GEMINI_API_KEY
        sync: false
